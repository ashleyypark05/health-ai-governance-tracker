name: Monthly digest email

on:
  schedule:
    - cron: "0 13 14 * *"  # 13:00 UTC on the 14th — a day ahead of the 15th send date, for review
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build + send digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          PULSE_APP_URL: ${{ secrets.PULSE_APP_URL }}
        run: python pipeline/send_digest.py

      - name: Open review reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH=$(date -u +'%B %Y')
          gh issue create \
            --title "Review Pulse digest draft — $MONTH" \
            --assignee ashleyypark05 \
            --body "The $MONTH digest draft was built and pushed to Beehiiv as a draft (status: draft). Review the subject line, preview text, thumbnail, and content in the [Beehiiv dashboard](https://app.beehiiv.com/), then send it before the 15th."
