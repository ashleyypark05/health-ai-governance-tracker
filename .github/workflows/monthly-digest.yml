name: Monthly digest email

on:
  schedule:
    - cron: "0 13 14 * *"  # 13:00 UTC on the 14th — a day ahead of the 15th send date, for review
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build + send digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          PULSE_APP_URL: ${{ secrets.PULSE_APP_URL }}
        run: python pipeline/send_digest.py | tee digest_output.txt

      - name: Upload digest preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: pipeline/digest_preview.html
          if-no-files-found: ignore

      - name: Open review reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MONTH=$(date -u +'%B %Y')
          SUBJECT=$(grep '^Subject:' digest_output.txt | sed 's/^Subject: //')
          PREVIEW=$(grep '^Preview:' digest_output.txt | sed 's/^Preview: //')
          if grep -q "Digest post created in Beehiiv" digest_output.txt; then
            printf '%s\n\n**Subject:** %s\n**Preview text:** %s\n\nReview it in the [Beehiiv dashboard](https://app.beehiiv.com/), then send it before the 15th.\n' \
              "The $MONTH digest draft was built and pushed to Beehiiv as a draft (status: draft)." "$SUBJECT" "$PREVIEW" > issue_body.md
          else
            printf '%s\n\n**Subject:** %s\n**Preview text:** %s\n\nDownload the rendered HTML from this run'"'"'s `digest-preview` artifact, paste it into a new Beehiiv draft post (HTML/code view), set the subject line/preview text above and the thumbnail, then review and send before the 15th.\n\nWorkflow run: %s\n' \
              "The $MONTH digest content has been generated, but Beehiiv's post-creation API requires an Enterprise plan, so the draft wasn't created automatically." "$SUBJECT" "$PREVIEW" "$RUN_URL" > issue_body.md
          fi
          gh issue create \
            --title "Review Pulse digest draft — $MONTH" \
            --assignee ashleyypark05 \
            --body-file issue_body.md
